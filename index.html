<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiMarket - Global Semiconductor Market Analytics Dashboard (1970–2026)</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Explore the comprehensive history of the global semiconductor memory and logic markets from 1970 to 2026. Interactive charts, market sizes, and historical milestones.">
  <meta name="keywords" content="DRAM, Flash, NAND, Logic, Semiconductor, Market Share, Memory Market, Samsung, SK Hynix, Micron, Kioxia, NVIDIA, Intel, AMD, TSMC, Bar Chart Race">
  <meta name="author" content="SiMarket Group">
  <meta name="google-site-verification" content="tQU4ms4HtuSSnlNO14YJO8OMyy59mqlFixqXl3Lhlbw" />
  
  <!-- OpenGraph & Twitter Social Cards -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SiMarket">
  <meta property="og:url" content="https://eljja.github.io/SiMarket/">
  <meta property="og:title" content="SiMarket - Global Semiconductor Market Analytics Dashboard (1970–2026)">
  <meta property="og:description" content="Explore 50+ years of semiconductor history across 10 sectors (Total, DRAM, Flash, Logic, Foundry, Fabless, MCU, Power). Interactive animated charts and market share analytics.">
  <meta property="og:image" content="https://eljja.github.io/SiMarket/simarket_preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SiMarket - Global Semiconductor Market Analytics Dashboard (1970–2026)">
  <meta name="twitter:description" content="Interactive semiconductor market share analytics tracking top vendors from 1970 through the 2026 AI supercycle peak.">
  <meta name="twitter:image" content="https://eljja.github.io/SiMarket/simarket_preview.png">
  
  <!-- Canonical & Multilingual Annotations -->
  <link rel="canonical" href="https://eljja.github.io/SiMarket/" />
  <link rel="alternate" hreflang="en" href="https://eljja.github.io/SiMarket/" />
  <link rel="alternate" hreflang="ko" href="https://eljja.github.io/SiMarket/index_ko.html" />
  <link rel="alternate" hreflang="x-default" href="https://eljja.github.io/SiMarket/" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Font Preloading (BUG FIX #11: move from CSS @import for faster load) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="market-total">

  <div class="app-container">
    <header class="glass-panel">
      <div class="logo-section">
        <div style="display: flex; align-items: center; gap: 10px;">
          <h1>Si<span>Market</span></h1>
          <div class="lang-switch-container">
            <span class="lang-switch-btn active">EN</span>
            <a href="index_ko.html" class="lang-switch-btn">KO</a>
          </div>
        </div>
      </div>
      <div class="market-selector">
        <button id="tab-total" class="tab-btn active">Total Semiconductor</button>
        <button id="tab-dram" class="tab-btn">DRAM</button>
        <button id="tab-flash" class="tab-btn">Flash Memory</button>
        <button id="tab-logic" class="tab-btn">Logic IC</button>
        <button id="tab-analog" class="tab-btn">Analog</button>
        <button id="tab-opto" class="tab-btn">Image & Opto</button>
        <button id="tab-power" class="tab-btn">Power & Discrete</button>
        <button id="tab-mcu" class="tab-btn">MCU</button>
        <button id="tab-foundry" class="tab-btn">Foundry</button>
        <button id="tab-fabless" class="tab-btn">Fabless</button>
      </div>
    </header>

    <!-- Main Dashboard Grid -->
    <main class="dashboard-grid">
      
      <!-- Left Column: Interactive Race Chart & Playback -->
      <section class="glass-panel main-viz-panel" aria-labelledby="viz-title-id">
        <div class="viz-header">
          <div class="viz-title">
            <h2 id="viz-title-id">Supplier Market Rank & Size</h2>
            <p>Animated ranking changes and individual supplier share metrics over time</p>
          </div>
          <div class="viz-actions">
            <button id="toggle-revenue" class="btn-toggle active" aria-pressed="true">Revenue (USD)</button>
            <button id="toggle-bytes" class="btn-toggle" aria-pressed="false">Capacity (Bytes)</button>
          </div>
        </div>

        <!-- Main Chart Area -->
        <div class="chart-container-race">
          <div id="race-chart" style="width: 100%; height: 100%;"></div>
          <!-- Huge Floating Year Background -->
          <div id="floating-year-display" class="year-display-huge">1970</div>
        </div>

        <!-- Timeline Control Bar -->
        <div class="timeline-bar">
          <div class="play-controls">
            <button id="prev-btn" class="btn-icon btn-step" aria-label="Previous Period" title="Previous Quarter/Year">
              <svg viewBox="0 0 24 24">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
              </svg>
            </button>
            
            <button id="play-btn" class="btn-icon" aria-label="Play/Pause Timeline" title="Play / Pause">
              <!-- Play Icon SVG -->
              <svg viewBox="0 0 24 24" id="play-icon">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <!-- Pause Icon SVG -->
              <svg viewBox="0 0 24 24" id="pause-icon" style="display: none;">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </button>

            <button id="next-btn" class="btn-icon btn-step" aria-label="Next Period" title="Next Quarter/Year">
              <svg viewBox="0 0 24 24">
                <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
              </svg>
            </button>
            
            <select id="speed-control" class="speed-control" aria-label="Playback Speed">
              <option value="2000">Slow (2s)</option>
              <option value="1000" selected>Normal (1s)</option>
              <option value="500">Fast (0.5s)</option>
              <option value="200">Turbo (0.2s)</option>
            </select>
          </div>

          <div class="slider-container">
            <input type="range" id="timeline-slider" aria-label="Timeline Slider" value="0">
            <span id="current-period" class="time-label-current">1970</span>
          </div>
        </div>
      </section>

      <!-- Right Column: Sidebar Analytics -->
      <aside class="sidebar-panel">
        
        <!-- System Intelligence & Status Meta Card -->
        <div class="glass-panel info-meta-card">
          <div class="meta-title">Global Semiconductor Market Intelligence</div>
          <div class="meta-badges">
            <span id="last-updated-badge" class="update-badge"></span>
            <span id="update-status-badge" class="status-badge"></span>
          </div>
        </div>

        <!-- Total Market stats card -->
        <div class="glass-panel stats-card">
          <div class="stat-item">
            <span id="stat-revenue-label" class="stat-label">Total Market Revenue</span>
            <div class="stat-value-container">
              <span class="stat-unit">$</span>
              <span id="stat-revenue-val" class="stat-value">0.00</span>
              <span class="stat-unit">Billion</span>
            </div>
          </div>
          
          <div class="stat-divider"></div>
          
          <div class="stat-item">
            <span id="stat-capacity-label" class="stat-label">Total Capacity Shipped</span>
            <div class="stat-value-container">
              <span id="stat-capacity-val" class="stat-value">0</span>
              <span id="stat-capacity-unit" class="stat-unit">Bytes</span>
            </div>
          </div>
        </div>

        <!-- Historical Milestone Card -->
        <div class="glass-panel milestone-card" aria-labelledby="milestone-title-id">
          <div id="milestone-title-id" class="card-title-sec">
            <!-- Info Icon SVG -->
            <svg viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
            </svg>
            Historical Context & Milestones
          </div>
          <div id="milestone-list" class="milestone-stream">
            <!-- Dynamic milestone items will be inserted here -->
          </div>
        </div>

        <!-- History Trend Charts -->
        <div class="glass-panel trend-card" aria-labelledby="trend-title-id">
          <div id="trend-title-id" class="card-title-sec">
            <!-- Chart Icon SVG -->
            <svg viewBox="0 0 24 24">
              <path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/>
            </svg>
            Market Growth Trend
          </div>
          <div class="chart-container-trend">
            <div id="trend-chart" style="width: 100%; height: 100%;"></div>
          </div>
        </div>

      </aside>

    </main>
  </div>

  <!-- Apache ECharts Library -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  
  <!-- Local Database and Logic -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
